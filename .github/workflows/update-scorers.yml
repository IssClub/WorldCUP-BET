name: Update top scorers

on:
  schedule:
    # פעם ביום 22:00 UTC = 00:00 ישראל חורף / 01:00 קיץ
    # אחרי שכל המשחקים היומיים הסתיימו
    - cron: '0 22 * * *'

  workflow_dispatch:

jobs:
  update-scorers:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Update top scorers
        run: node scripts/update-scorers.mjs
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          APISPORTS_KEY:        ${{ secrets.APISPORTS_KEY }}
