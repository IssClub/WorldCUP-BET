name: Pre-game reminders and auto-bets

on:
  # כל 15 דקות 11:00-23:00 UTC (14:00-02:00 ישראל) — מכסה 2h+ לפני ואחרי כל משחק
  # game-window מסנן ריצות שאינן בחלון pre-game האמיתי
  schedule:
    - cron: '*/15 11-23 * * *'

  workflow_dispatch:

jobs:
  pre-game:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # שלב 1: בדוק אם אנחנו בחלון pre-game
      - name: Check game window
        id: window
        run: node scripts/game-window.mjs
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # שלב 2: תזכורות + הימור אוטומטי — רק אם בחלון pre-game
      - name: Pre-game reminders and auto-bets
        if: steps.window.outputs.IN_PREGAME_WINDOW == 'true'
        run: node scripts/pre-game.mjs
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC_KEY:     ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:    ${{ secrets.VAPID_PRIVATE_KEY }}
