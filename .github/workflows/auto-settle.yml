name: Auto-settle games

on:
  # כל שעה בטווח 14:00-02:00 UTC (17:00-05:00 ישראל קיץ / 16:00-04:00 חורף)
  # מספיק רחב לכל לוח המשחקים האפשרי של ליגת העל
  # הסקריפט game-window בודק אם אנחנו בחלון אמיתי לפני שעושה קריאות יקרות
  schedule:
    - cron: '0 14-23 * * *'
    - cron: '0 0-2   * * *'

  workflow_dispatch:

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # שלב 1: בדוק אם אנחנו בחלון משחקים
      - name: Check game window
        id: window
        run: node scripts/game-window.mjs
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # שלב 2: סגור הימורים — רק אם בחלון תוצאות
      - name: Settle completed games
        if: steps.window.outputs.IN_SETTLE_WINDOW == 'true'
        run: node scripts/settle-games.mjs
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ODDS_API_KEY:         ${{ secrets.ODDS_API_KEY }}
          VAPID_PUBLIC_KEY:     ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY:    ${{ secrets.VAPID_PRIVATE_KEY }}
