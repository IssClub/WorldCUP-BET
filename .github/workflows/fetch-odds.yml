name: Fetch and lock odds

on:
  # כל שעה 11:00-20:00 UTC (14:00-23:00 ישראל) — מכסה את חלון הנעילה לפני משחקים
  # game-window מסנן ריצות שאינן בחלון האמיתי (3h לפני first kickoff)
  schedule:
    - cron: '0 11-20 * * *'

  workflow_dispatch:

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # שלב 1: בדוק אם אנחנו בחלון יחסים
      - name: Check game window
        id: window
        run: node scripts/game-window.mjs
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # שלב 2: נעל יחסים — רק אם בחלון odds
      - name: Fetch and lock odds
        if: steps.window.outputs.IN_ODDS_WINDOW == 'true'
        run: node scripts/fetch-odds.mjs
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ODDS_API_KEY:         ${{ secrets.ODDS_API_KEY }}
